# Publishes a release whenever the "## Version:" line in the .toc changes.
# Bump the version, push to main, and WoW Tinker Box picks it up.
name: Release addon

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read name and version from the .toc
        id: toc
        run: |
          TOC=$(ls *.toc | head -1)
          NAME="${TOC%.toc}"
          VERSION=$(grep -i '^## Version:' "$TOC" | head -1 | sed 's/^## Version:[[:space:]]*//I' | tr -d '\r[:space:]')
          if [ -z "$VERSION" ]; then echo "No ## Version: line in $TOC"; exit 1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.toc.outputs.tag }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.zip$'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.toc.outputs.tag }} is already released."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.check.outputs.exists == 'false'
        run: |
          NAME="${{ steps.toc.outputs.name }}"
          mkdir -p "build/$NAME"
          rsync -a --exclude='.git*' --exclude='.github' --exclude='build' --exclude='*.zip' ./ "build/$NAME/"
          cd build && zip -qr "../$NAME-${{ steps.toc.outputs.version }}-forever.zip" "$NAME"

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.toc.outputs.tag }}"
          ZIP="${{ steps.toc.outputs.name }}-${{ steps.toc.outputs.version }}-forever.zip"
          PRE=""; case "$TAG" in *-*) PRE="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "${{ steps.toc.outputs.name }} $TAG" --generate-notes $PRE
          fi

      # Optional: tells WoW Tinker Box's catalog to refresh right away instead of on its next
      # 15-minute run. Needs a CATALOG_TOKEN secret (fine-grained token with Actions: write on WoW-Tinker-Box).
      - name: Refresh Frank's Pack catalog
        if: steps.check.outputs.exists == 'false' && env.CATALOG_TOKEN != ''
        env:
          CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          GH_TOKEN: ${{ secrets.CATALOG_TOKEN }}
        run: gh workflow run catalog.yml -R LankyFranky89/WoW-Tinker-Box || true
